  <text x="27" y="860">Northstar Technologies | Austin, TX</text>
  <text x="659" y="860" text-anchor="end" class="small">2022 – Present</text>
  <text x="37" y="904" class="small"><tspan x="37">•  Partner with 12 managers to support a team of 250 employees.</tspan><tspan x="37" dy="33">•  Redesigned onboarding, improving new-hire satisfaction by 24%.</tspan><tspan x="37" dy="33">•  Built manager training on feedback, coaching and career growth.</tspan></text>
  <text x="27" y="1048" class="bold">HR Generalist</text>
  <text x="27" y="1080">Cedar People Group | Austin, TX</text>
  <text x="659" y="1080" text-anchor="end" class="small">2018 – 2022</text>
  <text x="37" y="1123" class="small"><tspan x="37">•  Supported recruitment, employee relations and HR operations.</tspan><tspan x="37" dy="33">•  Introduced quarterly engagement surveys and team action plans.</tspan><tspan x="37" dy="33">•  Reduced onboarding administration time by 30%.</tspan></text>
