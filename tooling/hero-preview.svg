  <text x="27" y="351" class="heading">Professional Summary</text>
  <path d="M27 367H660" class="rule" />
  <text x="27" y="405"><tspan x="27">People-focused HR partner with 8 years of experience supporting</tspan><tspan x="27" dy="31">growing teams. Trusted advisor to managers on employee relations,</tspan><tspan x="27" dy="31">talent development and practical people strategies.</tspan></text>
