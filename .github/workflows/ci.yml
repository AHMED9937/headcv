name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Translation Catalogs
        run: |
          pnpm lingui:extract
          git diff --exit-code -- apps/web/locales/en-US.po apps/web/locales/ar-SA.po

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundaries
        run: pnpm exec turbo boundaries

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
