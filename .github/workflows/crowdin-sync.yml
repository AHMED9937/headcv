name: Sync Translations from Crowdin

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowdin-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # Runs once the Crowdin project is configured; until then translations are maintained in-repo.
    env:
      CROWDIN_ENABLED: ${{ secrets.CROWDIN_PROJECT_ID != '' && secrets.CROWDIN_PERSONAL_TOKEN != '' }}

    steps:
      - name: Skip when Crowdin is not configured
        if: env.CROWDIN_ENABLED != 'true'
        run: echo "::notice::CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN are not set; skipping the Crowdin sync."

      - name: Checkout Repository
        if: env.CROWDIN_ENABLED == 'true'
        uses: actions/checkout@v6

      - name: Sync Translations from Crowdin
        if: env.CROWDIN_ENABLED == 'true'
        uses: crowdin/github-action@v2
        with:
          download_translations: true
          localization_branch_name: "l10n"
          commit_message: "[skip ci] chore(i18n): sync translations from crowdin"
          pull_request_title: "Sync Translations from Crowdin"
          pull_request_body: "This is an automated pull request to sync translations from [Crowdin](https://crowdin.com/project/headcv)."
          pull_request_labels: "l10n"
          pull_request_reviewers: "AHMED9937"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
