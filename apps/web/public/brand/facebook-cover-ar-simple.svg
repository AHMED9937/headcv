<svg xmlns="http://www.w3.org/2000/svg" width="3280" height="1248" viewBox="0 0 3280 1248" role="img" aria-labelledby="title desc">
	<title id="title">HeadCV Arabic Facebook cover</title>
	<desc id="desc">Simple Arabic marketing cover for HeadCV with AI assistant, ATS compatibility, and PDF export.</desc>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#152642" />
			<stop offset="1" stop-color="#1E3A5F" />
		</linearGradient>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#071426" flood-opacity="0.24" />
		</filter>
	</defs>

	<rect width="3280" height="1248" fill="url(#background)" />
	<circle cx="235" cy="112" r="355" fill="#274C76" opacity="0.55" />
	<circle cx="3155" cy="1195" r="430" fill="#274C76" opacity="0.5" />
	<path d="M0 1110C450 900 720 1030 1030 1248H0Z" fill="#D6B65B" opacity="0.12" />

	<!-- Product preview: intentionally simple, vector-sharp, and secondary to the message. -->
	<g transform="translate(420 220) rotate(-4 470 390)" filter="url(#shadow)">
		<rect x="180" y="40" width="630" height="810" rx="34" fill="#E8E0D6" opacity="0.55" />
		<rect x="60" y="0" width="630" height="810" rx="34" fill="#F8FAFC" />
		<rect x="60" y="0" width="630" height="112" rx="34" fill="#F4E9C9" />
		<rect x="60" y="78" width="630" height="34" fill="#F4E9C9" />
		<circle cx="146" cy="56" r="28" fill="#1E3A5F" />
		<rect x="196" y="36" width="250" height="20" rx="10" fill="#1E3A5F" />
		<rect x="196" y="68" width="170" height="12" rx="6" fill="#8190A4" />
		<rect x="122" y="170" width="170" height="18" rx="9" fill="#D6B65B" />
		<rect x="122" y="216" width="490" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="245" width="440" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="274" width="470" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="338" width="190" height="18" rx="9" fill="#1E3A5F" />
		<rect x="122" y="384" width="490" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="413" width="450" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="442" width="480" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="510" width="170" height="18" rx="9" fill="#1E3A5F" />
		<rect x="122" y="556" width="220" height="10" rx="5" fill="#C9D0D9" />
		<rect x="374" y="556" width="238" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="585" width="190" height="10" rx="5" fill="#C9D0D9" />
		<rect x="374" y="585" width="205" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="654" width="490" height="10" rx="5" fill="#C9D0D9" />
		<rect x="122" y="683" width="420" height="10" rx="5" fill="#C9D0D9" />
		<circle cx="618" cy="735" r="42" fill="#D6B65B" />
		<path d="m598 735 14 14 27-31" fill="none" stroke="#152642" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
	</g>

	<!-- Official HeadCV logo, rebuilt from the source SVG for standalone portability. -->
	<g transform="translate(1990 145) scale(2.45)">
		<rect x="2" y="2" width="36" height="36" rx="9" fill="#E8E0D6" />
		<path d="M12 11v18M12 20h14M26 11v18" stroke="#152642" stroke-width="4" stroke-linecap="round" />
		<path d="M29 2h9v9L29 2Z" fill="#1E3A5F" />
		<path d="m25 30 3 3 7-8" stroke="#D6B65B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
		<text x="48" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#E8E0D6">Head<tspan fill="#D6B65B">CV</tspan></text>
	</g>

	<g font-family="Segoe UI, Tahoma, Arial, sans-serif" text-anchor="middle" direction="rtl">
		<text x="2200" y="500" font-size="126" font-weight="800" fill="#F8FAFC">سيرة ذاتية أقوى، وفرصة أقرب.</text>
		<text x="2200" y="625" font-size="55" font-weight="400" fill="#E8E0D6">أنشئ سيرتك باحتراف، وحسّنها بالذكاء الاصطناعي.</text>
	</g>

	<!-- Three concise proof points. -->
	<g font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="38" font-weight="600" fill="#F8FAFC" text-anchor="middle">
		<g transform="translate(1630 735)">
			<circle cx="0" cy="0" r="34" fill="#D6B65B" />
			<path d="M-13 2-2 13 16-13" fill="none" stroke="#152642" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
			<text x="0" y="84" direction="rtl">متوافق مع ATS</text>
		</g>
		<g transform="translate(2065 735)">
			<circle cx="0" cy="0" r="34" fill="#D6B65B" />
			<path d="M0-18 6-6 19 0 6 6 0 19-6 6-19 0-6-6Z" fill="#152642" />
			<text x="0" y="84" direction="rtl">مساعد ذكي</text>
		</g>
		<g transform="translate(2485 735)">
			<circle cx="0" cy="0" r="34" fill="#D6B65B" />
			<path d="M-12-18h17l11 11v25h-28Z" fill="none" stroke="#152642" stroke-width="6" stroke-linejoin="round" />
			<path d="M5-18v12h11" fill="none" stroke="#152642" stroke-width="6" stroke-linejoin="round" />
			<text x="0" y="84" direction="rtl">تصدير PDF</text>
		</g>
	</g>

	<!-- CTA -->
	<g transform="translate(1930 930)">
		<rect width="770" height="150" rx="75" fill="#D6B65B" />
		<text x="385" y="98" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="62" font-weight="800" fill="#152642" text-anchor="middle" direction="rtl">ابدأ مجانًا</text>
		<path d="M95 75h58m-22-22 22 22-22 22" fill="none" stroke="#152642" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
	</g>
</svg>
